<!doctype html><html><head><meta charset="utf-8"><title>Wonderwood responsive QA harness</title><style>body{font:16px system-ui;background:#e9e9e9;margin:16px}label{margin-right:20px}select,button{font:inherit;padding:10px}iframe{display:block;background:white;border:1px solid #777;margin-top:16px;max-width:none}</style></head><body><h1>Responsive QA harness</h1><p>Explicit embedded viewport checks; not a substitute for physical-device testing.</p><label>Viewport<select id="size"><option value="320,740">320 × 740</option><option value="390,844">390 × 844</option><option value="768,1024">768 × 1024</option><option value="1024,768">1024 × 768</option><option value="1280,900">1280 × 900</option></select></label><label>Surface<select id="surface"><option value="home">Home</option><option value="map">Map</option><option value="chapter/ch08">Chapter</option><option value="story/ch08-a/sprout">Story</option><option value="activity/spelling/ch07">Word Builder</option><option value="activity/listening/ch08">Listening</option><option value="journal">Journal</option><option value="treehouse">Treehouse</option></select></label><button id="zoom">Toggle 200% text</button><iframe id="game" title="Game under test" src="../index.html#home" width="320" height="740"></iframe><script>const frame=document.querySelector('#game');document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;};document.querySelector('#surface').onchange=e=>frame.src='../index.html#'+e.target.value;let zoomed=false;document.querySelector('#zoom').onclick=()=>{zoomed=!zoomed;frame.contentDocument.documentElement.style.fontSize=zoomed?'200%':'';};</script></body></html>
